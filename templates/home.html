<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML DBT</title>
</head>
<body>

    <div class = "login">
        <h1>Welcome to ML DBT</h1>

        <form action = "/predict" method = "POST">

            <input type = "number" name = "age" placeholder = "Age" required><br>
            <input type = "number" name = "sex" placeholder = "Sex" required><br>
            <input type = "number" name = "bmi" placeholder = "BMI" required><br>
            <input type = "number" name = "bp" placeholder = "Blood Pressure" required><br>
            <input type = "number" name = "s1" placeholder = "S1" required><br>
            <input type = "number" name = "s2" placeholder = "S2" required><br>
            <input type = "number" name = "s3" placeholder = "S3" required><br>
            <input type = "number" name = "s4" placeholder = "S4" required><br>
            <input type = "number" name = "s5" placeholder = "S5" required><br>
            <input type = "number" name = "s6" placeholder = "S6" required><br>

            <button type = "submit">Predict </button>


        </form>

    </div>

    {{prediction_text}}
    
</body>
</html>
